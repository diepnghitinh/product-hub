# docker-compose.yml — run the whole product-hub stack (db + API + web + admin)
# with one command.
#
#   docker compose up --build          build the images and start everything
#   docker compose up -d --build       …in the background
#   docker compose logs -f             follow the logs
#   docker compose down                stop (add -v to also wipe the database)
#
# Open the app at      http://localhost:8080
# Platform console at  http://localhost:8081   (vendor/owner only — see saas-admin/)
# Each nginx serves its own SPA and reverse-proxies /v1 to the API, so each is ONE
# origin with no CORS. Swagger stays at http://localhost:3000/swagger for debugging.
#
# Config: every value below has a safe local default, so `up` works with zero
# setup. To override (e.g. a real JWT secret or Azure storage), copy .env.example
# to .env — compose reads it automatically. Do not run this alongside ./dev.sh;
# they share host ports 3000 / 27017.

name: product-hub

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────
  db:
    image: mongo:7
    container_name: producthub-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-producthub}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-producthub}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-producthub}
    ports:
      - '27017:27017' # exposed for Compass/mongosh; drop this line to keep it internal
    volumes:
      - producthub-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── NestJS API ───────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
    image: product-hub-backend:local
    container_name: producthub-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      # Talk to the db service over the compose network (not localhost).
      MONGODB_URI: mongodb://${MONGO_USER:-producthub}:${MONGO_PASSWORD:-producthub}@db:27017/${MONGO_DB:-producthub}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Platform console (/v1/platform) tokens. A DIFFERENT secret on purpose:
      # a workspace token must never be replayable against the vendor console.
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-dev-platform-secret-change-me}
      PLATFORM_JWT_EXPIRES_IN: ${PLATFORM_JWT_EXPIRES_IN:-12h}
      # Same-origin means CORS isn't needed for either SPA; this only matters if
      # you call the API cross-origin (e.g. straight from :3000 or another host).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:8081}
      # Optional Azure Blob storage for bug attachments. When unset the API falls
      # back to inline base64 data URLs, so the stack runs fine without it.
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      AZURE_STORAGE_CONTAINER: ${AZURE_STORAGE_CONTAINER:-}
    ports:
      - '3000:3000' # exposed for Swagger + direct API access; the app doesn't need it
    healthcheck:
      # Node 20 has global fetch — no extra tooling needed in the slim image.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ── Collab (Yjs sync server for collaborative doc editing) ───────────────
  collab:
    build:
      context: ./collab
    image: product-hub-collab:local
    container_name: producthub-collab
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3002'
      # Same database as the api: this service reads doc pages and mirrors the
      # rendered HTML back into them.
      MONGODB_URI: mongodb://${MONGO_USER:-producthub}:${MONGO_PASSWORD:-producthub}@db:27017/${MONGO_DB:-producthub}?authSource=admin
      # MUST match the api's secret — editors authenticate here with the very
      # same access token they use for REST calls.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # Only the /presence read is subject to CORS; WebSockets are not.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - '3002:3002' # exposed for debugging; the app reaches it through nginx
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ── Web (Vite SPA served by nginx) ───────────────────────────────────────
  web:
    build:
      context: ./frontend
      args:
        # Baked at build time. /v1 = same origin; nginx proxies it to the api.
        VITE_API_URL: '/v1'
        # Collaborative doc editing, through nginx's /collab proxy (upgrade
        # header included). The editor is the same Editor.js one an issue's
        # description uses either way; this is what makes a doc page *shared*.
        # Set it to '' to build an image that never talks to the collab service.
        VITE_COLLAB_URL: '/collab'
    image: product-hub-frontend:local
    container_name: producthub-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      # nginx resolves proxy_pass upstreams when it loads its config, so the
      # collab name has to exist before web starts or nginx exits with
      # "host not found in upstream".
      collab:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      # Compose-only nginx config that enables the /v1 → api proxy. Keeps the
      # image's baked-in nginx.conf production-clean.
      - ./deploy/nginx.web.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:80/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Admin (platform console — vendor/owner only) ─────────────────────────
  # Its own container on its own port, NOT a path under `web`. A workspace user
  # has no URL on the app's origin that serves this bundle, and that separation
  # is the point: see saas-admin/README.md.
  admin:
    build:
      context: ./saas-admin
      args:
        # /v1 = same origin; this container's nginx proxies it to the api.
        VITE_API_URL: '/v1'
        # Where "open workspace" links point. Empty hides them — set it only if
        # the tenant app is reachable from wherever operators sit.
        VITE_APP_URL: ${ADMIN_APP_URL:-http://localhost:8080}
    image: product-hub-saas-admin:local
    container_name: producthub-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${ADMIN_PORT:-8081}:80'
    volumes:
      # Compose-only nginx config that enables the /v1 → api proxy, exactly as
      # `web` does. The image's own nginx.conf stays deployment-neutral.
      - ./deploy/nginx.admin.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:80/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  producthub-mongo-data:
