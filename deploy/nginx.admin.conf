# nginx config for the platform console under docker-compose.
#
# Identical to saas-admin/nginx.conf, but with the "/v1 → api" reverse proxy
# ENABLED so the admin container forwards API calls to the `api` service over
# the compose network. The image's own nginx.conf stays deployment-neutral;
# compose bind-mounts this over it.
#
# The console runs in its own container on its own port on purpose. A workspace
# user gets no URL under the tenant app that serves this bundle — that
# separation is the whole point of the architecture, so do NOT "simplify" this
# into a /admin path on the web container.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Client-side routing: unknown paths fall back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets are immutable — cache them hard; never cache the shell.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Same-origin API: forward /v1/* to the api service. No trailing slash on
  # proxy_pass, so the full /v1/... path is preserved (the API is versioned there).
  location /v1/ {
    proxy_pass         http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
  }

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Basic hardening.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
}
